services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/bot.sqlite
      DESK_DATABASE_PATH: /app/data/desk.sqlite
      DESK_INSTRUMENTS: ${DESK_INSTRUMENTS:-BTCUSD,ETHUSD}
      DESK_DEMO_MODE: ${DESK_DEMO_MODE:-false}
      DESK_EXECUTION: ${DESK_EXECUTION:-disabled}
      DESK_STARTING_BALANCE: ${DESK_STARTING_BALANCE:-10000}
      DESK_MAX_LEVERAGE: ${DESK_MAX_LEVERAGE:-2}
      DELTA_IP_FAMILY: ${DELTA_IP_FAMILY:-4}
      DELTA_DEMO_API_KEY: ${DELTA_DEMO_API_KEY:-}
      DELTA_DEMO_API_SECRET: ${DELTA_DEMO_API_SECRET:-}
      DELTA_ENV: ${DELTA_ENV:-testnet}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped
