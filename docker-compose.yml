name: sunny

x-env: &env_file
  env_file:
    - ${ENV_FILE:-.env.testnet}

services:
  postgres:
    image: postgres:16-alpine
    <<: *env_file
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
      target: migrate
    <<: *env_file
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  engine:
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
      target: runtime
    <<: *env_file
    init: true
    restart: unless-stopped
    # No published ports: the health endpoint is only reachable inside the compose network.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: runtime
    <<: *env_file
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  backup:
    image: postgres:16-alpine
    <<: *env_file
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/usr/local/bin/backup.sh']
    environment:
      PGHOST: postgres
    # PGUSER/PGPASSWORD/PGDATABASE are derived from the POSTGRES_* values in the env file
    volumes:
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
