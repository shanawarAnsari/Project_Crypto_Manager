name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: '**/coverage'
          if-no-files-found: ignore

  images:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build engine image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/engine.Dockerfile
          target: runtime
          push: false
          cache-from: type=gha,scope=engine
          cache-to: type=gha,scope=engine,mode=max

      - name: Build migrate image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/engine.Dockerfile
          target: migrate
          push: false
          cache-from: type=gha,scope=engine

      - name: Build web image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          target: runtime
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
